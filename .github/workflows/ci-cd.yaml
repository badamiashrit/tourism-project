name: MLOps Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-train:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f tourism_project/deployment/requirements.txt ]; then
          pip install -r tourism_project/deployment/requirements.txt
        else
          pip install scikit-learn pandas numpy xgboost mlflow
        fi

    - name: Train and Register Model
      env:
        MLFLOW_TRACKING_URI: ./mlruns
      run: |
        # Execute training script if present
        if [ -f tourism_project/model_building/train.py ]; then
          python tourism_project/model_building/train.py
        else
          echo "No explicit training script found in model_building yet. Skipping step."
        fi
